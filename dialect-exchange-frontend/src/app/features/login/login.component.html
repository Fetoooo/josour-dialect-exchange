<div class="jusoor-wrapper" dir="rtl">
  
  <div class="bg-shapes">
    <div class="shape shape-teal"></div>
    <div class="shape shape-gold"></div>
    <div class="shape shape-blue"></div>
  </div>

  <div class="glass-card">
    
    <div class="brand-sidebar">
      <div class="brand-content">
        <div class="logo-container">
          <div class="soundwave">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </div>
          <h1 class="brand-name">جُسور</h1>
        </div>
        <p class="tagline">صوتك يعبر الحدود،<br>ولهجتك تبني جسراً.</p>
      </div>
      <div class="watermark">لغة الضاد</div>
    </div>

    <div class="form-side">
      <div class="form-header">
        <h2>أهلاً بك مجدداً</h2>
        <p>سجل دخولك لاستكشاف لهجات جديدة</p>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="jusoor-form" autocomplete="off">
        
        <div class="input-wrapper">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>البريد الإلكتروني</mat-label>
            <!-- ✅ FIXED: added space between matInput and [(ngModel)] -->
            <input matInput [(ngModel)]="loginData.email" name="login-email" type="email" autocomplete="new-password" [readonly]="!fieldsEnabled" (focus)="enableFields()" placeholder="name@domain.com" required>
            <mat-icon matSuffix>alternate_email</mat-icon>
          </mat-form-field>
        </div>

        <div class="input-wrapper">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>كلمة المرور</mat-label>
            <!-- ✅ FIXED: added space between matInput and [(ngModel)] -->
            <input matInput [(ngModel)]="loginData.password" name="login-password" type="password" autocomplete="new-password" [readonly]="!fieldsEnabled" (focus)="enableFields()" placeholder="••••••••" required>
            <mat-icon matSuffix>lock_outline</mat-icon>
          </mat-form-field>
        </div>

        <div class="forgot-password">
          <a routerLink="/forgot-password">هل نسيت كلمة المرور؟</a>
        </div>

        <button mat-flat-button class="submit-btn" [disabled]="(loginForm?.invalid ?? true) || isLoading()">
          <span *ngIf="!isLoading()">العبور للمنصة</span>
          <mat-spinner *ngIf="isLoading()" diameter="24" color="accent"></mat-spinner>
        </button>

        <div class="register-link">
          ليس لديك حساب؟ <a routerLink="/register">ابنِ جسراً معنا الآن!</a>
        </div>

        <a class="home-link" routerLink="/">العودة إلى الصفحة الرئيسية</a>

      </form>
    </div>

  </div>
</div>
