<main class="auth-page">
  <section class="auth-card">
    <p class="auth-brand">Jusoor</p>
    <div class="auth-icon">✉</div>
    <h1>نسيت كلمة المرور؟</h1>
    <p *ngIf="!sent()">أدخل بريدك الإلكتروني وسنرسل لك رابطا آمنا لتعيين كلمة مرور جديدة.</p>
    <p *ngIf="sent()" class="auth-message">إذا كان البريد مسجلا لدينا، فستصلك رسالة تحتوي على رابط إعادة التعيين.</p>

    <form *ngIf="!sent()" class="auth-form" (ngSubmit)="submit()" #form="ngForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" required email autocomplete="email">
      <button class="auth-primary" type="submit" [disabled]="form.invalid || isLoading()">{{ isLoading() ? 'جار الإرسال...' : 'إرسال رابط الاسترجاع' }}</button>
      <p *ngIf="error()" class="auth-message auth-error">{{ error() }}</p>
    </form>

    <a class="auth-link" routerLink="/login">العودة لتسجيل الدخول</a>
  </section>
</main>
