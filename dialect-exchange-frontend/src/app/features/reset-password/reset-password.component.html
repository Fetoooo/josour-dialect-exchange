<main class="auth-page">
  <section class="auth-card">
    <p class="auth-brand">Jusoor</p>
    <div class="auth-icon">🔒</div>
    <h1>تعيين كلمة مرور جديدة</h1>
    <p *ngIf="!completed()">اختر كلمة مرور قوية لحماية حسابك.</p>
    
    <div *ngIf="completed()" class="success-banner">
      <p class="auth-message auth-success">تم تغيير كلمة المرور بنجاح! جاري تحويلك إلى صفحة تسجيل الدخول...</p>
      <a class="auth-primary-btn" routerLink="/login">تسجيل الدخول الآن</a>
    </div>

    <form *ngIf="!completed()" class="auth-form" (ngSubmit)="submit()" #form="ngForm">
      <label for="password">كلمة المرور الجديدة</label>
      <input id="password" name="password" type="password" [(ngModel)]="newPassword" required minlength="6" autocomplete="new-password">
      <label for="confirm-password">تأكيد كلمة المرور</label>
      <input id="confirm-password" name="confirmPassword" type="password" [(ngModel)]="confirmPassword" required autocomplete="new-password">
      <button class="auth-primary" type="submit" [disabled]="form.invalid || isLoading()">{{ isLoading() ? 'جار الحفظ...' : 'حفظ كلمة المرور' }}</button>
      <p *ngIf="error()" class="auth-message auth-error">{{ error() }}</p>
    </form>

    <a *ngIf="!completed()" class="auth-link" routerLink="/login">العودة لتسجيل الدخول</a>
  </section>
</main>
